name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (${{ matrix.suite }})
    if: github.event.created && !github.event.deleted
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: xctest
            arguments: --xctest-only
          - suite: packaging
            arguments: --fixtures-only --filter 'Packaging/*'
          - suite: native
            arguments: --fixtures-only --filter 'Helpers/*' --exclude 'Helpers/LDAC/LDACControllerVolumeCheck.py'
          - suite: controller-volume
            arguments: --fixtures-only --filter 'Helpers/LDAC/LDACControllerVolumeCheck.py'
    defaults:
      run:
        shell: bash
    env:
      CODE_SIGN_IDENTITY: '-'
      DEVELOPMENT_TEAM: ''
      ACOUPLET_INSTALLER_SIGNING_IDENTITY: ''
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=$(/usr/bin/xcode-select -p)" >> "$GITHUB_ENV"
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun --sdk macosx --show-sdk-version

      - name: Install uv
        env:
          UV_UNMANAGED_INSTALL: ${{ runner.temp }}/uv
        run: |
          installer="$RUNNER_TEMP/uv-installer.sh"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 --output "$installer" \
            https://github.com/astral-sh/uv/releases/download/0.13.4/uv-installer.sh
          printf '%s  %s\n' 1f5390d273b0158bd5eaa3527ae049f3667baa881abb1e7c883dd637d84432f9 "$installer" | /usr/bin/shasum -a 256 -c -
          /bin/sh "$installer"
          echo "$UV_UNMANAGED_INSTALL" >> "$GITHUB_PATH"

      - name: Set up Python
        run: |
          uv python install
          uv sync --locked
          uv run --locked python --version

      - name: Check Python style
        if: matrix.suite == 'packaging'
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Check system Python compatibility
        if: matrix.suite == 'packaging'
        run: |
          /usr/bin/python3 Packaging/check-prepare-updates.py
          /usr/bin/python3 Packaging/check-ldac-qualification.py

      - name: Fetch Sparkle dependency
        if: matrix.suite == 'xctest' || matrix.suite == 'packaging'
        run: Packaging/fetch-sparkle.sh

      - name: Run tests
        run: |
          mkdir -p .build/check-all/Logs
          if ! uv run --locked python Packaging/check-all.py ${{ matrix.arguments }} > .build/check-all/Logs/checks.log 2>&1; then
            tail -n 60 .build/check-all/Logs/checks.log
            exit 1
          fi
          tail -n 60 .build/check-all/Logs/checks.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Acouplet-test-results-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            .build/check-all/Logs/
            .build/check-all/Results/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Build Release
    needs: tests
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      version: ${{ steps.configuration.outputs.version }}
      build_number: ${{ steps.configuration.outputs.build_number }}
    defaults:
      run:
        shell: bash
    env:
      CODE_SIGN_IDENTITY: '-'
      DEVELOPMENT_TEAM: ''
      ACOUPLET_INSTALLER_SIGNING_IDENTITY: ''
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Validate release configuration
        id: configuration
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ACOUPLET_SIGNING_CERTIFICATE_SHA1: ${{ vars.ACOUPLET_SIGNING_CERTIFICATE_SHA1 }}
        run: |
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || ! "$ACOUPLET_SIGNING_CERTIFICATE_SHA1" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo '::error::Configure the private signing certificate, password and fingerprint described in Docs/Releasing.md.'
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo '::error::Release tags must start with v followed by two or three numeric components.'
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          build_number="$((195 + GITHUB_RUN_NUMBER))"
          echo "ACOUPLET_MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "ACOUPLET_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "DEVELOPER_DIR=$(/usr/bin/xcode-select -p)" >> "$GITHUB_ENV"
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun --sdk macosx --show-sdk-version

      - name: Import private signing certificate
        timeout-minutes: 3
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ACOUPLET_SIGNING_CERTIFICATE_SHA1: ${{ vars.ACOUPLET_SIGNING_CERTIFICATE_SHA1 }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/acouplet-private.keychain-db"
          certificate="$RUNNER_TEMP/acouplet-private.pem"
          identity="$RUNNER_TEMP/acouplet-private.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | /usr/bin/base64 --decode > "$identity"
          /usr/bin/openssl pkcs12 -in "$identity" -passin env:P12_PASSWORD -clcerts -nokeys -out "$certificate"
          fingerprint="$(/usr/bin/openssl x509 -in "$certificate" -noout -fingerprint -sha1 | /usr/bin/sed 's/.*=//;s/://g')"
          expected="$(printf '%s' "$ACOUPLET_SIGNING_CERTIFICATE_SHA1" | /usr/bin/tr 'a-f' 'A-F')"
          if [[ "$fingerprint" != "$expected" ]]; then
            echo '::error::The imported certificate does not match the configured fingerprint.'
            exit 1
          fi
          /usr/bin/openssl x509 -in "$certificate" -noout -checkend 0
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$identity" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          /usr/bin/security list-keychains -d user -s "$keychain"
          sudo -n /usr/bin/security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$certificate"
          echo "CODE_SIGN_IDENTITY=$fingerprint" >> "$GITHUB_ENV"
          echo "ACOUPLET_SIGNING_CERTIFICATE_SHA1=$fingerprint" >> "$GITHUB_ENV"
          /bin/rm -f "$identity"

      - name: Build Release with private certificate
        run: Packaging/package.sh --local

      - name: Verify private driver authentication
        run: Packaging/check-private-signing.sh

      - name: Create unsigned DMG
        run: |
          stage="$PWD/.build/release/payload"
          mount="$RUNNER_TEMP/acouplet-dmg"
          writable="$PWD/.build/release/writable.dmg"
          mkdir -p "$stage" "$mount" dist
          /usr/bin/ditto .build/local-update/Acouplet/Acouplet.app "$stage/Acouplet.app"
          /bin/ln -s /Applications "$stage/Applications"
          /usr/bin/xattr -cr "$stage/Acouplet.app"
          /usr/bin/codesign --verify --deep --strict --all-architectures \
            --test-requirement="=identifier \"dev.baglayan.Acouplet\" and certificate leaf = H\"$ACOUPLET_SIGNING_CERTIFICATE_SHA1\"" \
            "$stage/Acouplet.app"
          size_mb="$(( $(/usr/bin/du -sm "$stage" | /usr/bin/awk '{print $1}') + 256 ))"
          /usr/sbin/diskutil image create blank --volumeName Acouplet --fs APFS \
            --format RAW --size "${size_mb}M" "$writable"
          trap '/usr/sbin/diskutil eject "$mount" >/dev/null 2>&1 || true' EXIT
          /usr/sbin/diskutil image attach --mountOptions nobrowse --mountPoint "$mount" "$writable"
          /usr/bin/ditto "$stage" "$mount"
          /usr/bin/xattr -cr "$mount/Acouplet.app"
          /usr/bin/codesign --verify --deep --strict --all-architectures \
            --test-requirement="=identifier \"dev.baglayan.Acouplet\" and certificate leaf = H\"$ACOUPLET_SIGNING_CERTIFICATE_SHA1\"" \
            "$mount/Acouplet.app"
          /usr/sbin/diskutil eject "$mount"
          /usr/sbin/diskutil image create from --format UDZO \
            "$writable" "dist/Acouplet-$ACOUPLET_MARKETING_VERSION.dmg"
          /usr/bin/hdiutil verify "dist/Acouplet-$ACOUPLET_MARKETING_VERSION.dmg"
          /usr/sbin/diskutil image attach --readOnly --mountOptions nobrowse --mountPoint "$mount" \
            "dist/Acouplet-$ACOUPLET_MARKETING_VERSION.dmg"
          /usr/bin/codesign --verify --deep --strict --all-architectures \
            --test-requirement="=identifier \"dev.baglayan.Acouplet\" and certificate leaf = H\"$ACOUPLET_SIGNING_CERTIFICATE_SHA1\"" \
            "$mount/Acouplet.app"
          /usr/bin/cmp "$stage/Acouplet.app/Contents/MacOS/Acouplet" \
            "$mount/Acouplet.app/Contents/MacOS/Acouplet"
          /usr/sbin/diskutil eject "$mount"
          trap - EXIT

      - name: Remove private signing credentials
        if: always()
        timeout-minutes: 2
        run: |
          sudo -n /usr/bin/python3 Packaging/cleanup-private-signing.py "$RUNNER_TEMP"

      - name: Archive release evidence and calculate checksum
        run: |
          evidence="$PWD/.build/release/evidence"
          mkdir -p "$evidence"
          /bin/cp '.build/local-update/Acouplet/Local Build Receipt.txt' "$evidence/Build Receipt.txt"
          /bin/cp .build/package-build.log "$evidence/"
          /usr/bin/ditto .build/Build/Products/Release/Acouplet.app.dSYM "$evidence/Acouplet.app.dSYM"
          /usr/bin/ditto '.build/Build/Products/Release/Acouplet Battery Publisher.dSYM' \
            "$evidence/Acouplet Battery Publisher.dSYM"
          /usr/bin/tar -czf "dist/Acouplet-$ACOUPLET_MARKETING_VERSION-evidence.tar.gz" \
            -C "$evidence" .
          cd dist
          /usr/bin/shasum -a 256 "Acouplet-$ACOUPLET_MARKETING_VERSION.dmg" > SHA256SUMS.txt

      - name: Upload Release DMG
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Acouplet-${{ steps.configuration.outputs.version }}-${{ steps.configuration.outputs.build_number }}
          path: |
            dist/Acouplet-${{ steps.configuration.outputs.version }}.dmg
            dist/Acouplet-${{ steps.configuration.outputs.version }}-evidence.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Acouplet-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/package-build.log
            .build/local-update/Acouplet/Local Build Receipt.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      ACOUPLET_MARKETING_VERSION: ${{ needs.release.outputs.version }}
      ACOUPLET_BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified Release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Acouplet-${{ env.ACOUPLET_MARKETING_VERSION }}-${{ env.ACOUPLET_BUILD_NUMBER }}
          path: dist

      - name: Verify downloaded DMG checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish Release with DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$ACOUPLET_MARKETING_VERSION"
          tag_commit="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag does not point to the commit built by this run."
            exit 1
          fi
          notes="$RUNNER_TEMP/acouplet-release-notes.md"
          cat > "$notes" <<EOF
          Acouplet $ACOUPLET_MARKETING_VERSION (build $ACOUPLET_BUILD_NUMBER).

          Download Acouplet-$ACOUPLET_MARKETING_VERSION.dmg and SHA256SUMS.txt, then verify with:

          ~~~sh
          shasum -a 256 -c SHA256SUMS.txt
          ~~~

          The app includes experimental LDAC support and is signed with the project's private certificate. The DMG is unsigned and the app is not notarized.

          Source commit: $GITHUB_SHA
          Build run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          EOF
          release_url="$(gh release create "$tag" \
            "dist/Acouplet-$ACOUPLET_MARKETING_VERSION.dmg" \
            dist/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Acouplet $ACOUPLET_MARKETING_VERSION" \
            --notes-file "$notes" \
            --latest)"
          printf 'Published Release: %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
